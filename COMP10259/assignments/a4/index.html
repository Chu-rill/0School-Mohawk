<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Target Clicker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body
    class="bg-primary bg-gradient d-flex align-items-center justify-content-center min-vh-100 py-4"
  >
    <main class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 text-center">
        <div id="win-card">
          <h1>You Win🏆</h1>
          <button id="restartBtn" class="btn btn-light rounded-pill px-4">
            Restart
          </button>
        </div>
        <p class="text-secondary mb-3">
          Get a score of 5 to Win <br />
          Press <strong>Start</strong> to begin.
        </p>

        <div
          class="d-flex align-items-center justify-content-center gap-3 mb-3"
        >
          <span class="fs-5">
            Score:
            <span id="gameScore" class="badge bg-success fs-6">0</span>
          </span>
          <button id="startBtn" class="btn btn-success rounded-pill px-4">
            Start
          </button>
        </div>

        <svg
          id="myArea"
          width="500"
          height="500"
          class="border border-3 border-dark rounded-3"
        >
          <image
            href="background.svg"
            x="0"
            y="0"
            width="500"
            height="500"
          ></image>
        </svg>
      </div>
    </main>
  </body>
</html>
