<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Image Shuffler</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="text-center py-4 mb-4">
      <h1 class="fw-bold mb-1">Random Image Shuffler</h1>
    </header>

    <main class="container">
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="shadow-sm">
            <img id="img0" src="images/cat_1.jpg" alt="Cat image" />
          </div>
        </div>
        <div class="col-md-4">
          <div class="shadow-sm">
            <img id="img1" src="images/dog_1.jpg" alt="Dog Image" />
          </div>
        </div>
        <div class="col-md-4">
          <div class="shadow-sm">
            <img id="img2" src="images/star_1.jpeg" alt="Star Image" />
          </div>
        </div>
      </div>

      <!-- controls -->
      <div class="row g-4 justify-content-center text-center">
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <label for="interval" class="form-label text-body-secondary"
                >Auto-refresh (ms)</label
              >
              <input
                type="number"
                id="interval"
                class="form-control text-center"
                value="2500"
                min="500"
                max="10000"
                step="100"
              />
              <small class="text-body-secondary">Range 500 - 10000</small>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div id="timerCard" class="card shadow-sm h-100 timer-green">
            <div class="card-body">
              <p class="mb-1">Next shuffle in</p>
              <span id="countdown" class="display-6 fw-bold">2.5</span>
              <span>s</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <p class="text-body-secondary mb-1">Images shown</p>
              <span id="counter" class="display-6 fw-bold d-block mb-2">0</span>
              <button id="randomize" class="btn btn-primary">Randomize</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center text-body-secondary py-4 mt-4">
      Churchill Daniel - 000983683 - 2026
    </footer>
  </body>
</html>
