<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <title>Assignment 2</title>
  </head>
  <body>
    <header class="m-4">
      <h1>Churchill Daniel</h1>
      <h2 class="text-muted fs-5">000983683</h2>
    </header>

    <main class="container my-4">
      <div class="accordion shadow-sm" id="problemsAccordion">
        <!-- Group 1, Choice 1 -->
        <section class="accordion-item">
          <h2 class="accordion-header" id="heading_g1c1">
            <button
              class="accordion-button"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapse_g1c1"
              aria-expanded="true"
              aria-controls="collapse_g1c1"
            >
              Group 1 - Choice 1: Number in range (0 or 13-17)
            </button>
          </h2>
          <div
            id="collapse_g1c1"
            class="accordion-collapse collapse show"
            aria-labelledby="heading_g1c1"
            data-bs-parent="#problemsAccordion"
          >
            <div class="accordion-body">
              <label for="g1c1_input" class="form-label">
                Enter a number:
              </label>
              <input
                type="text"
                class="form-control mb-3"
                id="g1c1_input"
                onchange="group_1_choice_1()"
              />
              <label for="g1c1_output" class="form-label">Result:</label>
              <textarea
                class="form-control output-area"
                id="g1c1_output"
                rows="2"
                readonly
              ></textarea>
            </div>
          </div>
        </section>

        <!-- Group 1, Choice 3 -->
        <section class="accordion-item">
          <h2 class="accordion-header" id="heading_g1c3">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapse_g1c3"
              aria-expanded="false"
              aria-controls="collapse_g1c3"
            >
              Group 1 - Choice 3: Perimeter and area of a square
            </button>
          </h2>
          <div
            id="collapse_g1c3"
            class="accordion-collapse collapse"
            aria-labelledby="heading_g1c3"
            data-bs-parent="#problemsAccordion"
          >
            <div class="accordion-body">
              <label for="g1c3_input" class="form-label">
                Enter the side length of a square:
              </label>
              <input
                type="text"
                class="form-control mb-3"
                id="g1c3_input"
                onchange="group_1_choice_3()"
              />
              <label for="g1c3_output" class="form-label">Result:</label>
              <textarea
                class="form-control output-area"
                id="g1c3_output"
                rows="2"
                readonly
              ></textarea>
            </div>
          </div>
        </section>

        <!-- Group 2, Choice 1 -->
        <section class="accordion-item">
          <h2 class="accordion-header" id="heading_g2c1">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapse_g2c1"
              aria-expanded="false"
              aria-controls="collapse_g2c1"
            >
              Group 2 - Choice 1: Vowel check
            </button>
          </h2>
          <div
            id="collapse_g2c1"
            class="accordion-collapse collapse"
            aria-labelledby="heading_g2c1"
            data-bs-parent="#problemsAccordion"
          >
            <div class="accordion-body">
              <label for="g2c1_input" class="form-label">
                Enter a single letter:
              </label>
              <input
                type="text"
                class="form-control mb-3"
                id="g2c1_input"
                onchange="group_2_choice_1()"
              />
              <label for="g2c1_output" class="form-label">Result:</label>
              <textarea
                class="form-control output-area"
                id="g2c1_output"
                rows="2"
                readonly
              ></textarea>
            </div>
          </div>
        </section>

        <!-- Group 2, Choice 3 -->
        <section class="accordion-item">
          <h2 class="accordion-header" id="heading_g2c3">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapse_g2c3"
              aria-expanded="false"
              aria-controls="collapse_g2c3"
            >
              Group 2 - Choice 3: Factorial of a positive integer
            </button>
          </h2>
          <div
            id="collapse_g2c3"
            class="accordion-collapse collapse"
            aria-labelledby="heading_g2c3"
            data-bs-parent="#problemsAccordion"
          >
            <div class="accordion-body">
              <label for="g2c3_input" class="form-label">
                Enter a positive integer:
              </label>
              <input
                type="text"
                class="form-control mb-3"
                id="g2c3_input"
                onchange="group_2_choice_3()"
              />
              <label for="g2c3_output" class="form-label">Result:</label>
              <textarea
                class="form-control output-area"
                id="g2c3_output"
                rows="2"
                readonly
              ></textarea>
            </div>
          </div>
        </section>

        <!-- Group 3, Choice 1 -->
        <section class="accordion-item">
          <h2 class="accordion-header" id="heading_g3c1">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapse_g3c1"
              aria-expanded="false"
              aria-controls="collapse_g3c1"
            >
              Group 3 - Choice 1: Little endian binary to integer
            </button>
          </h2>
          <div
            id="collapse_g3c1"
            class="accordion-collapse collapse"
            aria-labelledby="heading_g3c1"
            data-bs-parent="#problemsAccordion"
          >
            <div class="accordion-body">
              <label for="g3c1_input" class="form-label">
                Enter a binary string (10-20 characters of 0s and 1s):
              </label>
              <input
                type="text"
                class="form-control mb-3"
                id="g3c1_input"
                onchange="group_3_choice_1()"
              />
              <label for="g3c1_output" class="form-label">Result:</label>
              <textarea
                class="form-control output-area"
                id="g3c1_output"
                rows="2"
                readonly
              ></textarea>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
