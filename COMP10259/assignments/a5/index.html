<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 5 - AJAX, JSON, and DOM</title>

    <!-- Bootstrap 5 CSS (from CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- My small custom styles (just the card image size) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <!-- The user types a choice here and clicks one of the three buttons. -->
      <div class="row justify-content-center mb-4">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <p class="form-label fw-bold mb-2">Choose a topic:</p>
              <div class="mb-3">
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="choice"
                    id="choiceMario"
                    value="mario"
                    checked
                  />
                  <label class="form-check-label" for="choiceMario"
                    >Mario</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="choice"
                    id="choiceStarWars"
                    value="starwars"
                  />
                  <label class="form-check-label" for="choiceStarWars"
                    >Star Wars</label
                  >
                </div>
              </div>
              <div>
                <button id="firstButton" class="btn btn-primary m-1">
                  First
                </button>
                <button id="secondButton" class="btn btn-primary m-1">
                  Second
                </button>
                <button id="thirdButton" class="btn btn-primary m-1">
                  Third
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- First button: heading goes here. -->
      <div id="headingArea"></div>

      <!-- Second button: cards go here. -->
      <div id="cardArea" class="row g-3 mb-2"></div>

      <!-- Copyright notice for the images. -->
      <div id="copyrightImages" class="text-center text-muted small mb-4"></div>

      <!-- Third button: the whole table is built by JavaScript into here. -->
      <div id="tableArea" class="mb-4"></div>

      <!-- Copyright notice for the table. -->
      <div id="copyrightTable" class="text-center text-muted small mt-3"></div>
    </div>

    <!-- Bootstrap 5 JS bundle (from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- My script -->
    <script src="app.js"></script>
  </body>
</html>
